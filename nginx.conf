server {
    listen 80;
    server_name _;

    # Device inform endpoint — proxy ke controller port 8080
    # Digunakan saat adopt: set-inform http://<DOMAIN>/inform
    location /inform {
        proxy_pass http://unifi-controller:8080/inform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;

        # Inform payload bisa besar
        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Web UI — proxy ke controller HTTPS port 8443
    location / {
        proxy_pass https://unifi-controller:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
